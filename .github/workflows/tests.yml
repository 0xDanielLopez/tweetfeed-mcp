name: tests

# Senal temprana, NO el gate de deploy (wrangler deploy sigue siendo manual -
# ver ~/code/CLAUDE.md). Este repo no tiene una suite de unit tests separada
# de la que tirar aqui: el unico script "test" en package.json (test/test.mjs)
# hace fetch() en vivo contra el MCP server desplegado (default
# MCP_URL=https://mcp.tweetfeed.live) y contra api.tweetfeed.live para
# ground-truth - mismo patron que test/compare.mjs y test/since.mjs en el
# repo hermano api-worker, excluidos alli por la misma razon: por diseno no
# son deterministas (dependen del estado real de prod, no del diff del PR) y
# no son aptos para bloquear un push/PR. Se corre a mano con `npm test`
# (post-deploy, no en CI). El type-check es por tanto el unico chequeo
# automatico aqui.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
